:root{
  --bg: #F8FAFC;
  --bg-soft: #F1F5F9;
  --bg-elev: #FFFFFF;

  --accent-2: #1A73E8;

  --red: #EF4444;

  --border-strong: rgba(0,0,0,0.08);

}

  width:6px;

::-webkit-scrollbar-thumb{
  background: #CBD5E1;

}

::-webkit-scrollbar-track{
